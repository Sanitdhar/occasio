name: Release

# D36 — a milestone completing is the release trigger. Push the tag, get the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Draft the release
    runs-on: ubuntu-latest
    steps:
      # Lower risk than the CI workflow -- a tag push is not contributor code -- but the
      # credential is equally unnecessary: `action-gh-release` authenticates with GITHUB_TOKEN
      # from the environment, not with the one checkout leaves in `.git/config`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
