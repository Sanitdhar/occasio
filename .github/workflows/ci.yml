name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # D19 gate 1 — types, boundaries, hardcoded colours, logic.
  verify:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      # `pull_request` runs a contributor's code, and `actions/checkout` writes the job's token
      # into `.git/config` by default. On a public repo that leaves a credential inside reach of
      # anything the checkout then runs -- an npm lifecycle script, a test, a Playwright
      # fixture. No job here pushes, so none of them needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Prove the architectural rules actually fire
        run: npm run verify:enforcement
      - run: npm test -- --selectProjects unit

  # D19 gate 2 — the mock -> Supabase swap guarantee.
  contracts:
    name: Adapter contract tests
    runs-on: ubuntu-latest
    steps:
      # `pull_request` runs a contributor's code, and `actions/checkout` writes the job's token
      # into `.git/config` by default. On a public repo that leaves a credential inside reach of
      # anything the checkout then runs -- an npm lifecycle script, a test, a Playwright
      # fixture. No job here pushes, so none of them needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contracts

  # D19 gate 3 — theme regressions unit tests structurally cannot catch.
  #
  # Runs in a PINNED Playwright container, never on a bare runner: font rendering differs
  # between environments, and unpinned baselines produce phantom diffs on every PR.
  visual:
    name: Visual regression across tenants
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not tag: a tag is mutable, so an unpinned image means CI runs
      # whatever was pushed there last. The digest below is v1.63.0-noble, which must match
      # the exact `playwright` version in package.json -- the image ships browsers built for
      # that client and a mismatch fails at launch. Bump the digest and the package together.
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      # `pull_request` runs a contributor's code, and `actions/checkout` writes the job's token
      # into `.git/config` by default. On a public repo that leaves a credential inside reach of
      # anything the checkout then runs -- an npm lifecycle script, a test, a Playwright
      # fixture. No job here pushes, so none of them needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No --if-present. The script exists, and a gate that skips silently is not a gate.
      - name: Render every route at both widths, light and dark
        run: npm run test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Uploaded on success too: the screenshots are the point, not just the failures.
        if: always()
        with:
          name: visual-screenshots
          path: .artifacts/visual/
          retention-days: 7

  # D19 gate 4 — Metro and platform-split mistakes (a .native.ts reaching web).
  web-build:
    name: Web export build
    runs-on: ubuntu-latest
    steps:
      # `pull_request` runs a contributor's code, and `actions/checkout` writes the job's token
      # into `.git/config` by default. On a public repo that leaves a credential inside reach of
      # anything the checkout then runs -- an npm lifecycle script, a test, a Playwright
      # fixture. No job here pushes, so none of them needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No --if-present: the script exists now, and a gate that silently skips is worse
      # than no gate. If the export breaks, this job must fail.
      - run: npm run build:web
      - name: Fail if the export produced nothing
        run: |
          test -f apps/mobile/dist/index.html
          test -n "$(find apps/mobile/dist/_expo -name '*.js' -print -quit)"
