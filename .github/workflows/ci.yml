name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # D19 gate 1 — types, boundaries, hardcoded colours, logic.
  verify:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Prove the architectural rules actually fire
        run: npm run verify:enforcement
      - run: npm test -- --selectProjects unit

  # D19 gate 2 — the mock -> Supabase swap guarantee.
  contracts:
    name: Adapter contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contracts

  # D19 gate 3 — theme regressions unit tests structurally cannot catch.
  #
  # Runs in a PINNED Playwright container, never on a bare runner: font rendering differs
  # between environments, and unpinned baselines produce phantom diffs on every PR.
  visual:
    name: Visual regression across tenants
    runs-on: ubuntu-latest
    container:
      # Must match the exact `playwright` version in package.json: the image ships browsers
      # built for that client, and a mismatch fails at launch. Bump both together.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No --if-present. The script exists, and a gate that skips silently is not a gate.
      - name: Render every route at both widths, light and dark
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        # Uploaded on success too: the screenshots are the point, not just the failures.
        if: always()
        with:
          name: visual-screenshots
          path: .artifacts/visual/
          retention-days: 7

  # D19 gate 4 — Metro and platform-split mistakes (a .native.ts reaching web).
  web-build:
    name: Web export build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No --if-present: the script exists now, and a gate that silently skips is worse
      # than no gate. If the export breaks, this job must fail.
      - run: npm run build:web
      - name: Fail if the export produced nothing
        run: |
          test -f apps/mobile/dist/index.html
          test -n "$(find apps/mobile/dist/_expo -name '*.js' -print -quit)"
